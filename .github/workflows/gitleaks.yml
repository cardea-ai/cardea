name: self-detection (NFR-SS-05)

# Cardea 자신의 로그·코드에도 자기 탐지를 적용한다(CLAUDE.md 4장). gitleaks는
# ADR-0007이 선택한 자가 탐지 OSS(MIT, 29k+ stars) — 코드/커밋에 시크릿이
# 새는지 매 push·PR마다 검사한다. 실패하면 머지를 막는다(fail-closed).
#
# gitleaks/gitleaks-action@v2 래퍼는 쓰지 않는다 — 그 래퍼는 organization
# 저장소에 유료 GITLEAKS_LICENSE를 요구한다(gitleaks 바이너리 자체는 MIT로
# 계속 무료지만, 래퍼만 유료화됐다). CLAUDE.md 1장 "무료 기능의 탐지 품질은
# 유료와 동일해야 한다"는 원칙에 따라, MIT 바이너리를 직접 설치해서 돌린다.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 git 히스토리를 스캔해야 과거 커밋에 섞인 시크릿도 잡는다

      - name: gitleaks 설치 (MIT 바이너리 직접 설치, 유료 래퍼 미사용)
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks 실행
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v
